name: Import pinned official AOSP 17 ART source

on:
  push:
    branches:
      - ci/a17-art-import-20261103
    paths:
      - .github/workflows/import-aosp17-art.yml

permissions:
  contents: write

concurrency:
  group: aosp17-art-import
  cancel-in-progress: false

jobs:
  source-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AOSP_URL: https://android.googlesource.com/platform/art
      AOSP_REF: refs/tags/android-17.0.0_r1
      EXPECTED_COMMIT: b753cf97923c3695338d21466fa14c57b480a59a
      EXPECTED_TREE: 539d87e9b7c4b00b7f1443cca44578c5b9f6e5b2
      OUTPUT_BRANCH: port/a17-art-aosp17-base-20261103
    steps:
      - name: Fetch and check upstream release history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-art"
          git -C "$RUNNER_TEMP/aosp-art" init -q
          git -C "$RUNNER_TEMP/aosp-art" remote add official "$AOSP_URL"
          # Fetch complete parent/object history: a shallow push is not accepted
          # by the GitHub server and cannot establish source provenance.
          git -C "$RUNNER_TEMP/aosp-art" fetch --no-tags official "$AOSP_REF"
          resolved="$(git -C "$RUNNER_TEMP/aosp-art" rev-parse 'FETCH_HEAD^{commit}')"
          tree="$(git -C "$RUNNER_TEMP/aosp-art" rev-parse "$resolved^{tree}")"
          test "$resolved" = "$EXPECTED_COMMIT" || { echo "Wrong AOSP commit: $resolved"; exit 1; }
          test "$tree" = "$EXPECTED_TREE" || { echo "Wrong AOSP source tree: $tree"; exit 1; }
          git -C "$RUNNER_TEMP/aosp-art" fsck --connectivity-only --no-reflogs
          echo "Verified official AOSP ART tag commit $resolved / tree $tree"

      - name: Publish isolated source branch, never overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="https://github.com/$GITHUB_REPOSITORY.git"
          ref="refs/heads/$OUTPUT_BRANCH"
          current="$(git ls-remote "$destination" "$ref" | cut -f1)"
          if [[ -n "$current" ]]; then
            test "$current" = "$EXPECTED_COMMIT" || {
              echo "Refusing to overwrite an existing non-upstream branch: $current"
              exit 1
            }
            echo "Source branch already exists at the correct AOSP commit."
            exit 0
          fi
          # A short-lived GitHub Actions token; no PAT, no terminal credentials.
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$RUNNER_TEMP/aosp-art" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push --no-thin "$destination" "$EXPECTED_COMMIT:$ref"
          echo "Published verified AOSP17 ART to $OUTPUT_BRANCH"
